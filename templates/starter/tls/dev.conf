# The dev loop over HTTPS, for another device on the network (a phone, say): https://<this machine>:8443/ is the dev server's
# http://localhost:8064/, with the certificate docker-compose.yml mounts at /certs.
server {
    listen 8443 ssl;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/privkey.pem;
    # plain HTTP on this port (nginx's 497) sent to the same address over HTTPS
    error_page 497 =307 https://$host:$server_port$request_uri;

    # Through the proxy every request comes from this machine, which is who the dev server lets stop it: not from the network.
    location = /__hotreload_stop    { return 403; }
    location = /__hotreload_project { return 403; }

    location / {
        proxy_pass http://127.0.0.1:8064;
        proxy_buffering off;
    }
}
