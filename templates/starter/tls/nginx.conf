# nginx's own configuration for both services, in place of the image's: one worker, and only warnings and errors said, so it's
# quiet beside the dev loop's messages; the service's server (tls/dev.conf or tls/dist.conf) is conf.d/default.conf.
worker_processes 1;
error_log stderr warn;

events {
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    include /etc/nginx/conf.d/*.conf;
}
