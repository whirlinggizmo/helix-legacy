# The release build over HTTPS, for another device on the network (a phone, say): https://<this machine>:8495/ serves out/dist/
# (haxe hxml/build.dist.hxml makes it) as a host would, with the certificate docker-compose.yml mounts at /certs.
server {
    listen 8495 ssl;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/privkey.pem;
    # plain HTTP on this port (nginx's 497) sent to the same address over HTTPS
    error_page 497 =307 https://$host:$server_port$request_uri;

    root /site;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
